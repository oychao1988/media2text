[project]
name = "media2text"
version = "0.1.0"
description = "Douyin live/VOD capture and transcribe CLI for agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "playwright>=1.42",
  "structlog>=24.1",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.0"]
transcribe-cloud = ["openai>=1.0"]
transcribe-deepgram = ["deepgram-sdk>=4.0"]
aliyundrive = ["aligo>=6.2.8"]
desktop = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "websockets>=12.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.3", "pyright>=1.1"]

[project.scripts]
media2text = "media2text.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media2text"]

[tool.hatch.build.targets.wheel.sources]
"src/media2text" = "media2text"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "live: needs real Douyin network",
  "desktop: m2t-desktop API unit tests (requires desktop extra)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
include = ["src"]
extraPaths = ["src"]
