# 转注 Work macOS 发布：push tag zhuanzhu-v* 时构建 dmg 并上传 Release
name: Zhuanzhu Release

on:
  push:
    tags:
      - "zhuanzhu-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semver (e.g. 0.1.0) — workflow_dispatch only; tag push ignores this"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/zhuanzhu-work/package-lock.json

      - name: Resolve version
        id: ver
        working-directory: desktop/zhuanzhu-work
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == zhuanzhu-v* ]]; then
            echo "version=${GITHUB_REF_NAME#zhuanzhu-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        working-directory: desktop/zhuanzhu-work
        run: npm ci

      - name: Prepare bundled runtime
        working-directory: desktop/zhuanzhu-work
        env:
          HTTP_PROXY: ${{ vars.HTTP_PROXY }}
          HTTPS_PROXY: ${{ vars.HTTPS_PROXY }}
        run: npm run prepare-bundle

      - name: Verify bundle
        working-directory: desktop/zhuanzhu-work
        run: npm run verify-bundle

      - name: Build dmg
        working-directory: desktop/zhuanzhu-work
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.ZHUANZHU_MAC_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.ZHUANZHU_MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "${CSC_LINK}" ]]; then
            npm run package:mac
          else
            echo "::notice::No signing secrets — building unsigned dmg"
            npm run package:mac:unsigned
          fi

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('zhuanzhu-v{0}', steps.ver.outputs.version) }}
          name: 转注 Work ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            desktop/zhuanzhu-work/dist/*.dmg
            desktop/zhuanzhu-work/dist/*.blockmap
            desktop/zhuanzhu-work/dist/latest-mac.yml
          fail_on_unmatched_files: true
