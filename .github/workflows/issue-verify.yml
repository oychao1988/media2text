name: Issue Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  issue-verify:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Resolve issue number
        id: issue
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          num=""
          if [[ "$HEAD_REF" =~ ^issue-([0-9]+)- ]]; then
            num="${BASH_REMATCH[1]}"
          fi
          if [[ -z "$num" && -n "$PR_BODY" ]]; then
            num=$(echo "$PR_BODY" | grep -Eo '(Fixes|Closes)\s+#([0-9]+)' | head -1 | grep -Eo '[0-9]+' || true)
          fi
          if [[ -z "$num" ]]; then
            echo "No issue-N branch or Fixes #N in PR body — skipping issue-verify"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "num=$num" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Install deps
        if: steps.issue.outputs.skip != 'true'
        run: |
          python -m pip install -U pip
          pip install -e ".[desktop,dev]"
          pnpm install --frozen-lockfile

      - name: Run issue verification commands
        if: steps.issue.outputs.skip != 'true'
        run: python scripts/issue_verify.py --issue ${{ steps.issue.outputs.num }}
