workspace: ./data

platforms:
  douyin:
    poll_interval_sec: 60
    download_concurrency: 3
    max_sync_pages: 0

monitor:
  live_poll_interval_sec: 60
  vod_poll_interval_sec: 300
  max_creators_per_vod_tick: 0
  profile_stale_days: 7

live:
  # After a live recording remuxes to .mp4, refresh agent-manifest.json for that creator.
  # When true and transcribe.engine is configured (whisper / openai / deepgram), also write
  # {basename}.transcript.json / .transcript.md beside the mp4 and refresh manifest again.
  # Skipped gracefully (logged, transcribe_skipped in run_once finalized[]) if extra missing.
  transcribe_on_complete: false
  ffmpeg_path: ffmpeg
  ffmpeg_stop_timeout_sec: 30
  temp_format: flv

transcribe:
  # whisper: local faster-whisper (pip install -e ".[transcribe]")
  # openai: OpenAI Audio API (pip install -e ".[transcribe-cloud]", set OPENAI_API_KEY)
  # deepgram: Deepgram REST (pip install -e ".[transcribe-deepgram]", export DEEPGRAM_API_KEY)
  engine: whisper
  language: zh
  whisper:
    model: medium
    device: auto
    # CPU: int8 is much faster than float32; use float16 on CUDA when supported
    compute_type: int8
    vad_filter: true
    extract_audio: true
  openai:
    api_key_env: OPENAI_API_KEY
    model: whisper-1
    # base_url: https://api.openai.com/v1
  deepgram:
    api_key_env: DEEPGRAM_API_KEY
    model: nova-3
    extract_audio: true
    smart_format: true
    punctuate: true
    utterances: true
    diarize: false
    timeout_sec: 600
