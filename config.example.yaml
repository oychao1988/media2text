workspace: ./data

platforms:
  douyin:
    poll_interval_sec: 60
    download_concurrency: 3
    max_sync_pages: 0
  bilibili:
    live_poll_interval_sec: 0
    archive_poll_interval_sec: 300
    dynamic_poll_interval_sec: 120
    max_sync_pages: 0
    download_concurrency: 3

monitor:
  live_poll_interval_sec: 60
  vod_poll_interval_sec: 300
  max_creators_per_vod_tick: 0
  profile_stale_days: 7

live:
  # After a live recording remuxes to .mp4, refresh agent-manifest.json for that creator.
  # When true and transcribe.engine is configured (whisper / openai / deepgram), transcribe
  # runs in the post-process drain (monitor daemon or `media2text post-process run`), not inline.
  transcribe_on_complete: false
  live_poll_interval_sec: 20
  offline_confirm_polls: 3
  ffmpeg_exit_recheck: true
  max_reconnect_attempts: 2
  min_recording_sec_before_offline_end: 45
  post_process_poll_interval_sec: 10
  post_process_max_parallel: 1
  ffmpeg_path: ffmpeg
  ffmpeg_stop_timeout_sec: 30
  temp_format: flv

# 个人阿里云盘：直播录制完成后自动备份（阶段 B，默认关闭）
aliyundrive:
  enabled: false
  token_path: sessions/aliyundrive.token.json
  parent_file_id: root
  root_folder: media2text
  creator_key: nickname
  min_free_bytes: 5368709120
  upload_on_live_complete: true
  upload_transcripts: true
  delete_local_after_upload: true
  on_insufficient_space: rolling_cleanup
  rolling_cleanup:
    max_delete_per_round: 20
  upload_retries: 2

# 监控事件提醒：提示音 + 飞书群机器人 webhook（二选一或同时开启）
notify:
  enabled: false
  sound: true
  # sound_path: /System/Library/Sounds/Glass.aiff
  events:
    live_started: true
    new_aweme: true          # 抖音新作品
    new_archive: true        # B 站投稿新 bvid
    new_dynamic: true        # B 站动态新条目
    recording_completed: true
    transcribe_completed: true
    upload_completed: true
    upload_failed: true
    upload_skipped: true
    upload_cleanup: true
  feishu:
    enabled: true
    # 推荐用环境变量，勿提交真实 URL：export NOTIFY_FEISHU_WEBHOOK_URL='https://open.feishu.cn/...'
    webhook_url: ""
    webhook_url_env: NOTIFY_FEISHU_WEBHOOK_URL

transcribe:
  # whisper: local faster-whisper (pip install -e ".[transcribe]")
  # openai: OpenAI Audio API (pip install -e ".[transcribe-cloud]", set OPENAI_API_KEY)
  # deepgram: Deepgram REST (pip install -e ".[transcribe-deepgram]", export DEEPGRAM_API_KEY)
  engine: whisper
  language: zh
  whisper:
    model: medium
    device: auto
    # CPU: int8 is much faster than float32; use float16 on CUDA when supported
    compute_type: int8
    vad_filter: true
    extract_audio: true
  openai:
    api_key_env: OPENAI_API_KEY
    model: whisper-1
    # base_url: https://api.openai.com/v1
  deepgram:
    api_key_env: DEEPGRAM_API_KEY
    model: nova-3
    extract_audio: true
    smart_format: true
    punctuate: true
    utterances: true
    diarize: false
    timeout_sec: 600

summarize:
  enabled: false
  engine: openai
  on_transcribe_complete: false
  default_profile: auto
  merge_gap_minutes: 60
  merge_date_tz: UTC
  max_files_per_run: 0
  llm:
    temperature: 0.2
    top_p: 0.95
    max_output_tokens: 4096
    thinking: false
    log_token_usage: true
    providers:
      - name: nvidia
        base_url: https://integrate.api.nvidia.com/v1
        api_key_envs: [NVIDIA_API_KEY]
        models: [deepseek-ai/deepseek-v4-pro]
      # - name: openai
      #   base_url: https://api.openai.com/v1
      #   api_key_envs: [OPENAI_API_KEY]
      #   models: [gpt-4o-mini]
  chunk:
    max_chars: 24000
    minutes: 30
  merge:
    auto_merge_after_parts: false
