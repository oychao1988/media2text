workspace: ./data

platforms:
  douyin:
    poll_interval_sec: 60
    download_concurrency: 3
    max_sync_pages: 0

monitor:
  live_poll_interval_sec: 60
  vod_poll_interval_sec: 300
  max_creators_per_vod_tick: 0
  profile_stale_days: 7

live:
  # After a live recording remuxes to .mp4, refresh agent-manifest.json for that creator.
  # When true and transcribe.engine is configured (whisper / openai / deepgram), also write
  # {basename}.transcript.json / .transcript.md beside the mp4 and refresh manifest again.
  # Skipped gracefully (logged, transcribe_skipped in run_once finalized[]) if extra missing.
  transcribe_on_complete: false
  ffmpeg_path: ffmpeg
  ffmpeg_stop_timeout_sec: 30
  temp_format: flv

# 监控事件提醒：提示音 + 飞书群机器人 webhook（二选一或同时开启）
notify:
  enabled: false
  sound: true
  # sound_path: /System/Library/Sounds/Glass.aiff
  events:
    live_started: true
    new_aweme: true
    recording_completed: true
    transcribe_completed: true
  feishu:
    enabled: true
    # 推荐用环境变量，勿提交真实 URL：export NOTIFY_FEISHU_WEBHOOK_URL='https://open.feishu.cn/...'
    webhook_url: ""
    webhook_url_env: NOTIFY_FEISHU_WEBHOOK_URL
    rich_text: true
    summary_max_chars: 500
    # 可选：内网 HTTP 根（相对 workspace），富文本里「转写/媒体」可点击打开
    # 先运行: media2text notify serve  再填下面地址（终端会打印 LAN URL）
    # media_base_url: http://192.168.1.10:8765
    show_local_paths: false
    # 未配 media_base_url 时，转录完成再发 1–2 条文本消息推送 .transcript.md 正文
    transcript_push: true
    transcript_push_max_chars: 6000
    transcript_push_max_messages: 2
    image_enabled: true
    image_separate_message: true
    image_in_post: false
    thumbnail_from_video: true
    avatar_on_live_start: true
    # 图片上传需飞书自建应用（与机器人同应用），非 webhook  alone
    app_id_env: FEISHU_APP_ID
    app_secret_env: FEISHU_APP_SECRET

transcribe:
  # whisper: local faster-whisper (pip install -e ".[transcribe]")
  # openai: OpenAI Audio API (pip install -e ".[transcribe-cloud]", set OPENAI_API_KEY)
  # deepgram: Deepgram REST (pip install -e ".[transcribe-deepgram]", export DEEPGRAM_API_KEY)
  engine: whisper
  language: zh
  whisper:
    model: medium
    device: auto
    # CPU: int8 is much faster than float32; use float16 on CUDA when supported
    compute_type: int8
    vad_filter: true
    extract_audio: true
  openai:
    api_key_env: OPENAI_API_KEY
    model: whisper-1
    # base_url: https://api.openai.com/v1
  deepgram:
    api_key_env: DEEPGRAM_API_KEY
    model: nova-3
    extract_audio: true
    smart_format: true
    punctuate: true
    utterances: true
    diarize: false
    timeout_sec: 600
