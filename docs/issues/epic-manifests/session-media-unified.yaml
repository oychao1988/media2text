  - name: issue-297
    run: python scripts/issue_verify.py --issue 297

  - name: issue-305-r0b-apple-silicon
    run: python scripts/issue_verify.py --issue 305
    optional: true

  - name: issue-298
    run: python scripts/issue_verify.py --issue 298

  - name: issue-299
    run: python scripts/issue_verify.py --issue 299

  - name: issue-300
    run: python scripts/issue_verify.py --issue 300

  - name: issue-301
    run: python scripts/issue_verify.py --issue 301

  - name: streaming-stt-finalize
    run: pytest tests/unit/test_segment_finalize_sidecar.py tests/unit/test_streaming_stt_resilience.py::test_streaming_finalize_merges_reconnect_segments -v --tb=short -q

  - name: playback-regression
    run: pytest tests/unit/test_playback_api.py tests/unit/test_cloud_byte_proxy.py tests/unit/test_session_playback.py -v -m desktop --tb=short -q

  - name: desktop-playback
    run: pnpm --filter m2t-desktop test -- ViewPlayback.test.tsx
